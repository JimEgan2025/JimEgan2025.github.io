<div id="rainfall-widget" style="font-family: Arial, Helvetica, sans-serif; width: 100%; box-sizing: border-box; border: 1px solid #d0d7de; border-radius: 10px; padding: 20px; background: #f8fbff;">
  <div style="font-size: 18px; font-weight: bold; color: #1a3c5e; margin-bottom: 10px;">
    7-Day Rainfall Outlook — Vizcaya, TX
  </div>
  <div id="rw-loading" style="color: #555; font-size: 13px;">Loading forecast…</div>
  <div id="rw-content" style="display:none;">
    <div style="text-align:center; margin: 12px 0 18px 0;">
      <div style="font-size: 40px; font-weight: bold; color: #0b5fa5;" id="rw-total">0.00"</div>
      <div style="font-size: 13px; color: #666;">Total forecast rainfall, next 168 hours</div>
    </div>
    <table id="rw-table" style="width:100%; border-collapse: collapse; font-size: 14px; margin: 0 auto 8px auto;">
      <thead>
        <tr style="border-bottom: 1px solid #ccc; text-align:left; color:#333;">
          <th style="padding:6px 8px;">Day</th>
          <th style="padding:6px 8px; text-align:right;">Rain</th>
        </tr>
      </thead>
      <tbody id="rw-tbody"></tbody>
    </table>

    <div style="margin-top:22px;">
      <div style="display:flex; justify-content:center; gap:10px; margin-bottom:14px;">
        <button type="button" class="rw-range-btn" data-hours="24" style="padding:6px 18px; font-size:13px; border:1px solid #0b5fa5; border-radius:16px; background:#0b5fa5; color:#fff; cursor:pointer;">24 hr</button>
        <button type="button" class="rw-range-btn" data-hours="72" style="padding:6px 18px; font-size:13px; border:1px solid #0b5fa5; border-radius:16px; background:#fff; color:#0b5fa5; cursor:pointer;">72 hr</button>
        <button type="button" class="rw-range-btn" data-hours="168" style="padding:6px 18px; font-size:13px; border:1px solid #0b5fa5; border-radius:16px; background:#fff; color:#0b5fa5; cursor:pointer;">168 hr</button>
      </div>
      <div style="position:relative; width:100%; overflow-x:auto;">
        <canvas id="rw-chart" style="display:block;"></canvas>
      </div>
      <div id="rw-chart-msg" style="font-size:12px; color:#999; text-align:center; margin-top:8px;">
        Hourly precipitation (inches) — hover/tap a bar for its value
      </div>
    </div>

    <div style="font-size: 11px; color: #999; text-align:right; margin-top:14px;">
      Source: Open-Meteo • Updated <span id="rw-updated"></span>
    </div>
  </div>
  <div id="rw-error" style="display:none; color:#a30000; font-size:13px;"></div>
</div>

<script>
(function() {
  var LAT = 30.5871, LON = -97.641;
  var url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=" + LAT
    + "&longitude=" + LON
    + "&hourly=precipitation"
    + "&forecast_hours=168"
    + "&precipitation_unit=inch"
    + "&timezone=America%2FChicago";

  var DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function weekdayFromISODate(y, m, d) {
    var t = [0,3,2,5,0,3,5,1,4,6,2,4];
    if (m < 3) { y -= 1; }
    var dow = (y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) + t[m-1] + d) % 7;
    return DAY_NAMES[dow];
  }

  function hourLabel(isoStr, includeDate) {
    var datePart = isoStr.substring(0, 10);
    var hourPart = parseInt(isoStr.substring(11, 13), 10);
    var parts = datePart.split("-");
    var m = parseInt(parts[1], 10);
    var d = parseInt(parts[2], 10);
    var hr12 = hourPart % 12;
    if (hr12 === 0) hr12 = 12;
    var ampm = hourPart < 12 ? "a" : "p";
    if (includeDate) {
      var wd = weekdayFromISODate(parseInt(parts[0], 10), m, d).substring(0, 3);
      return wd + " " + m + "/" + d + " " + hr12 + ampm;
    }
    return hr12 + ampm;
  }

  function showFatalError(msg) {
    document.getElementById("rw-loading").style.display = "none";
    var errEl = document.getElementById("rw-error");
    errEl.textContent = "Couldn't load the forecast: " + msg;
    errEl.style.display = "block";
    console.error("Rainfall widget error:", msg);
  }

  var hourlyTimes = [];
  var hourlyPrecip = [];

  fetch(url)
    .then(function(r) {
      if (!r.ok) { throw new Error("Open-Meteo HTTP " + r.status); }
      return r.json();
    })
    .then(function(data) {
      if (!data.hourly || !data.hourly.time) {
        throw new Error("Unexpected response shape from Open-Meteo");
      }
      hourlyTimes = data.hourly.time;
      hourlyPrecip = data.hourly.precipitation;
      buildTableAndReveal();
      wireButtons();
      renderChart(24);
    })
    .catch(function(err) {
      showFatalError(err.message || String(err));
    });

  function buildTableAndReveal() {
    var total = 0;
    var byDay = {};
    var order = [];

    for (var i = 0; i < hourlyTimes.length; i++) {
      var day = hourlyTimes[i].substring(0, 10);
      var amt = hourlyPrecip[i] || 0;
      total += amt;
      if (!(day in byDay)) { byDay[day] = 0; order.push(day); }
      byDay[day] += amt;
    }

    document.getElementById("rw-total").textContent = total.toFixed(2) + '"';

    var tbody = document.getElementById("rw-tbody");
    order.forEach(function(day) {
      var parts = day.split("-");
      var y = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      var d = parseInt(parts[2], 10);
      var weekday = weekdayFromISODate(y, m, d).substring(0, 3);
      var label = weekday + " " + m + "/" + d;
      var amt = byDay[day];

      var tr = document.createElement("tr");
      tr.style.borderBottom = "1px solid #eee";

      var tdDay = document.createElement("td");
      tdDay.style.padding = "6px 8px";
      tdDay.style.color = "#333";
      tdDay.appendChild(document.createTextNode(label));

      var tdAmt = document.createElement("td");
      tdAmt.style.padding = "6px 8px";
      tdAmt.style.textAlign = "right";
      tdAmt.style.fontWeight = amt > 0.01 ? "bold" : "normal";
      tdAmt.style.color = amt > 0.01 ? "#0b5fa5" : "#999";
      tdAmt.appendChild(document.createTextNode(amt.toFixed(2) + '"'));

      tr.appendChild(tdDay);
      tr.appendChild(tdAmt);
      tbody.appendChild(tr);
    });

    document.getElementById("rw-updated").textContent = new Date().toLocaleString();
    document.getElementById("rw-loading").style.display = "none";
    document.getElementById("rw-content").style.display = "block";
  }

  var canvas = document.getElementById("rw-chart");
  var currentHours = 24;
  var barGeom = [];

  function renderChart(hoursToShow) {
    currentHours = hoursToShow;
    var n = Math.min(hoursToShow, hourlyTimes.length);
    var values = hourlyPrecip.slice(0, n);
    var labels = [];
    for (var i = 0; i < n; i++) {
      labels.push(hourLabel(hourlyTimes[i], hoursToShow > 24));
    }

    var minBarWidth = hoursToShow <= 24 ? 28 : (hoursToShow <= 72 ? 12 : 6);
    var wrapperWidth = canvas.parentElement.clientWidth;
    var neededWidth = n * minBarWidth;
    var cssWidth = Math.max(wrapperWidth, neededWidth);
    var cssHeight = 320;

    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;

    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    var maxVal = 0;
    for (var j = 0; j < values.length; j++) {
      if (values[j] > maxVal) maxVal = values[j];
    }
    if (maxVal <= 0) maxVal = 0.1;

    var padLeft = 48, padRight = 12, padTop = 14, padBottom = 60;
    var plotW = cssWidth - padLeft - padRight;
    var plotH = cssHeight - padTop - padBottom;
    var barSlot = plotW / n;
    var barW = Math.max(2, barSlot * 0.7);

    ctx.strokeStyle = "#e6edf3";
    ctx.fillStyle = "#999";
    ctx.font = "11px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    var ticks = 5;
    for (var t = 0; t <= ticks; t++) {
      var val = (maxVal / ticks) * t;
      var y = padTop + plotH - (val / maxVal) * plotH;
      ctx.beginPath();
      ctx.moveTo(padLeft, y);
      ctx.lineTo(cssWidth - padRight, y);
      ctx.stroke();
      ctx.fillText(val.toFixed(2) + '"', padLeft - 6, y);
    }

    barGeom = [];
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    for (var k = 0; k < n; k++) {
      var v = values[k] || 0;
      var barH = (v / maxVal) * plotH;
      var x = padLeft + k * barSlot + (barSlot - barW) / 2;
      var y2 = padTop + plotH - barH;

      ctx.fillStyle = v > 0.01 ? "#0b5fa5" : "#cfe0f0";
      ctx.fillRect(x, y2, barW, Math.max(barH, v > 0 ? 2 : 0));

      barGeom.push({ x: x, y: y2, w: barW, h: Math.max(barH, 1), value: v, label: labels[k] });

      var showEvery = Math.ceil(n / (hoursToShow <= 24 ? 24 : (hoursToShow <= 72 ? 24 : 28)));
      if (k % showEvery === 0) {
        ctx.save();
        ctx.translate(x + barW / 2, padTop + plotH + 8);
        ctx.rotate(-Math.PI / 3);
        ctx.textAlign = "right";
        ctx.fillStyle = "#666";
        ctx.font = "10px Arial";
        ctx.fillText(labels[k], 0, 0);
        ctx.restore();
      }
    }
  }

  var tooltip = document.createElement("div");
  tooltip.style.position = "fixed";
  tooltip.style.pointerEvents = "none";
  tooltip.style.background = "#1a3c5e";
  tooltip.style.color = "#fff";
  tooltip.style.padding = "5px 10px";
  tooltip.style.borderRadius = "4px";
  tooltip.style.fontSize = "12px";
  tooltip.style.display = "none";
  tooltip.style.zIndex = "9999";
  document.body.appendChild(tooltip);

  function findBarAt(canvasX, canvasY) {
    for (var i = 0; i < barGeom.length; i++) {
      var b = barGeom[i];
      if (canvasX >= b.x && canvasX <= b.x + b.w && canvasY >= b.y && canvasY <= b.y + b.h + 4) {
        return b;
      }
    }
    return null;
  }

  function handlePointer(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width / (window.devicePixelRatio || 1);
    var scaleY = canvas.height / rect.height / (window.devicePixelRatio || 1);
    var cx = (clientX - rect.left) * scaleX;
    var cy = (clientY - rect.top) * scaleY;
    var bar = findBarAt(cx, cy);
    if (bar) {
      tooltip.textContent = bar.label + ": " + bar.value.toFixed(2) + '"';
      tooltip.style.left = (clientX + 12) + "px";
      tooltip.style.top = (clientY - 30) + "px";
      tooltip.style.display = "block";
    } else {
      tooltip.style.display = "none";
    }
  }

  canvas.addEventListener("mousemove", function(e) {
    handlePointer(e.clientX, e.clientY);
  });
  canvas.addEventListener("mouseleave", function() {
    tooltip.style.display = "none";
  });
  canvas.addEventListener("touchstart", function(e) {
    if (e.touches && e.touches[0]) {
      handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }
  });

  var resizeTimer = null;
  window.addEventListener("resize", function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (hourlyTimes.length) { renderChart(currentHours); }
    }, 150);
  });

  function wireButtons() {
    var btns = document.querySelectorAll(".rw-range-btn");
    btns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        btns.forEach(function(b) { b.style.background = "#fff"; b.style.color = "#0b5fa5"; });
        btn.style.background = "#0b5fa5";
        btn.style.color = "#fff";
        renderChart(parseInt(btn.getAttribute("data-hours"), 10));
      });
    });
  }
})();
</script>
