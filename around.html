<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Texas Live Weather & Mesonet Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-4 sm:p-6 text-slate-800">

    <div id="dashboard" class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-slate-900">Williamson County Weather Mesonet</h1>
                <div id="timestamp" class="text-sm text-slate-500 font-medium mt-1">Initializing telemetry...</div>
            </div>
            <div class="flex items-center gap-3">
                <span id="refresh-status" class="text-xs font-semibold text-slate-400">Auto-refreshes in 10m</span>
                <button id="btn-refresh" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition-colors shadow-sm flex items-center gap-1">
                    ↻ Refresh
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="text-center py-16 text-slate-500 font-semibold text-lg animate-pulse">
            Fetching satellite, radar, and convective atmospheric data...
        </div>

        <!-- Error Panel -->
        <div id="error-message" class="text-center py-12 text-rose-600 font-semibold text-lg hidden">
            Failed to load weather data. Please verify your connection and try again.
        </div>

        <!-- Weather Table -->
        <div id="table-container" class="overflow-x-auto hidden rounded-lg border border-slate-200">
            <table class="min-w-full divide-y divide-slate-200 text-left">
                <thead class="bg-slate-50">
                    <tr>
                        <th data-column="name" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200">
                            Town <span id="sort-name" class="text-blue-600 ml-1"></span>
                        </th>
                        <th data-column="temp" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200">
                            Temp <span id="sort-temp" class="text-blue-600 ml-1"></span>
                        </th>
                        <th data-column="feelsLike" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200">
                            Feels Like <span id="sort-feelsLike" class="text-blue-600 ml-1"></span>
                        </th>
                        <th data-column="dewPoint" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200">
                            Dew Pt (RH) <span id="sort-dewPoint" class="text-blue-600 ml-1"></span>
                        </th>
                        <th data-column="windSpeed" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200">
                            Wind / Gust <span id="sort-windSpeed" class="text-blue-600 ml-1"></span>
                        </th>
                        <th data-column="cape" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200" title="Convective Available Potential Energy (Thunderstorm Fuel)">
                            CAPE (J/kg) <span id="sort-cape" class="text-blue-600 ml-1"></span>
                        </th>
                        <th data-column="rain" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200">
                            Rain (1h) <span id="sort-rain" class="text-blue-600 ml-1"></span>
                        </th>
                        <th data-column="cloudPct" class="sortable px-4 py-3 text-xs font-bold text-slate-500 uppercase cursor-pointer hover:bg-slate-200">
                            Sky & Clouds <span id="sort-cloudPct" class="text-blue-600 ml-1"></span>
                        </th>
                    </tr>
                </thead>
                <tbody id="weather-rows" class="bg-white divide-y divide-slate-100 text-sm">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (function() {
            const API_KEY = "1e6b41c22ab05679125cfa1d5792621a";

            const towns = [
                { name: "Georgetown", lat: 30.6383, lon: -97.6780 },
                { name: "Round Rock", lat: 30.5083, lon: -97.6789 },
                { name: "Cedar Park", lat: 30.5066, lon: -97.8303 },
                { name: "Leander", lat: 30.5788, lon: -97.8531 },
                { name: "Liberty Hill", lat: 30.6644, lon: -97.9228 },
                { name: "Taylor", lat: 30.5708, lon: -97.4094 },
                { name: "Hutto", lat: 30.5427, lon: -97.5467 },
                { name: "Florence", lat: 30.8427, lon: -97.7942 },
                { name: "Granger", lat: 30.7188, lon: -97.4422 },
                { name: "Jarrell", lat: 30.8266, lon: -97.6067 },
                { name: "Weir", lat: 30.6358, lon: -97.5856 },
                { name: "Thrall", lat: 30.5891, lon: -97.2847 },
                { name: "Walburg", lat: 30.7257, lon: -97.5861 },
                { name: "Sun City", lat: 30.6869, lon: -97.7122 },
                { name: "Jollyville", lat: 30.4430, lon: -97.7781 }
            ];

            let currentWeatherData = [];
            let sortColumn = 'name'; 
            let sortAscending = true; 

            const show = id => document.getElementById(id).classList.remove('hidden');
            const hide = id => document.getElementById(id).classList.add('hidden');

            function getWindDirection(deg) {
                if (deg === undefined) return "S";
                const directions = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
                return directions[Math.round(deg / 22.5) % 16];
            }

            // Magnus-Tetens Dew Point formula (°F)
            function calculateDewPoint(tempF, rh) {
                const tempC = (tempF - 32) * 5 / 9;
                const a = 17.27;
                const b = 237.7;
                const alpha = ((a * tempC) / (b + tempC)) + Math.log(rh / 100.0);
                const dewC = (b * alpha) / (a - alpha);
                return Math.round((dewC * 9 / 5) + 32);
            }

            function formatSkyCondition(weatherMain, cloudPct, icon) {
                const isNight = icon && icon.endsWith('n');
                if (['Rain', 'Thunderstorm', 'Drizzle', 'Snow'].includes(weatherMain)) return weatherMain;
                if (cloudPct <= 10) return isNight ? "Clear" : "Sunny";
                if (cloudPct <= 25) return isNight ? "Mostly Clear" : "Mostly Sunny";
                if (cloudPct <= 50) return "Partly Cloudy";
                if (cloudPct <= 84) return "Mostly Cloudy";
                return "Overcast";
            }

            function getFeelsLikeBadge(feelsLike) {
                if (feelsLike >= 110) return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-purple-100 text-purple-800 border border-purple-300">${feelsLike}°F</span>`;
                if (feelsLike >= 105) return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-300">${feelsLike}°F</span>`;
                if (feelsLike >= 100) return `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">${feelsLike}°F</span>`;
                return `<span class="font-medium text-slate-600">${feelsLike}°F</span>`;
            }

            function getCapeBadge(cape) {
                if (cape >= 2500) return `<span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-700">${cape} <span class="text-[10px] uppercase font-normal">Ext</span></span>`;
                if (cape >= 1500) return `<span class="px-2 py-0.5 rounded text-xs font-bold bg-orange-100 text-orange-700">${cape} <span class="text-[10px] uppercase font-normal">Mod</span></span>`;
                if (cape >= 500) return `<span class="px-2 py-0.5 rounded text-xs font-medium bg-amber-50 text-amber-700">${cape}</span>`;
                return `<span class="text-xs text-slate-400">${cape || 0}</span>`;
            }

            function updateTimestamp() {
                const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };
                document.getElementById('timestamp').textContent = "Live Telemetry: " + new Date().toLocaleDateString('en-US', options);
            }

            // Batch fetch CAPE from Open-Meteo for all towns in 1 call
            async function fetchCapeData() {
                try {
                    const lats = towns.map(t => t.lat).join(',');
                    const lons = towns.map(t => t.lon).join(',');
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=cape`;
                    const res = await fetch(url);
                    if (!res.ok) return [];
                    const data = await res.json();
                    
                    // Single-point returns object, multi-point returns array
                    if (Array.isArray(data)) {
                        return data.map(d => Math.round(d.current?.cape || 0));
                    } else {
                        return [Math.round(data.current?.cape || 0)];
                    }
                } catch {
                    return [];
                }
            }

            async function fetchAllWeather() {
                hide('table-container');
                hide('error-message');
                show('loading');

                try {
                    // Fetch OpenWeatherMap and Open-Meteo CAPE concurrently
                    const [capeArray, ...owmResponses] = await Promise.all([
                        fetchCapeData(),
                        ...towns.map(t => 
                            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${t.lat}&lon=${t.lon}&units=imperial&appid=${API_KEY}`)
                                .then(r => r.json())
                        )
                    ]);

                    currentWeatherData = owmResponses.map((data, idx) => {
                        const temp = Math.round(data.main.temp);
                        const rh = data.main.humidity;
                        const dewPoint = calculateDewPoint(temp, rh);

                        let rainInches = 0;
                        if (data.rain?.['1h']) rainInches = Number((data.rain['1h'] * 0.0393701).toFixed(2));
                        else if (data.rain?.['3h']) rainInches = Number(((data.rain['3h'] / 3) * 0.0393701).toFixed(2));

                        const cloudPct = data.clouds?.all || 0;
                        const weatherMain = data.weather?.[0]?.main || 'Clear';
                        const icon = data.weather?.[0]?.icon || '01d';
                        const gust = data.wind?.gust ? Math.round(data.wind.gust) : null;

                        return {
                            name: towns[idx].name,
                            temp: temp,
                            feelsLike: Math.round(data.main.feels_like),
                            dewPoint: dewPoint,
                            humidity: rh,
                            windSpeed: Math.round(data.wind.speed),
                            windGust: gust,
                            windDir: getWindDirection(data.wind.deg),
                            cape: capeArray[idx] !== undefined ? capeArray[idx] : 0,
                            rain: rainInches,
                            cloudPct: cloudPct,
                            condition: formatSkyCondition(weatherMain, cloudPct, icon),
                            iconUrl: `https://openweathermap.org/img/wn/${icon}.png`
                        };
                    });

                    sortData(sortColumn, sortAscending);
                    updateTimestamp();
                } catch (err) {
                    hide('loading');
                    show('error-message');
                }
            }

            function sortData(columnProp, forceDirection = null) {
                if (forceDirection !== null) {
                    sortColumn = columnProp;
                    sortAscending = forceDirection;
                } else {
                    if (sortColumn === columnProp) sortAscending = !sortAscending;
                    else { sortColumn = columnProp; sortAscending = true; }
                }

                currentWeatherData.sort((a, b) => {
                    let valA = a[sortColumn] ?? 0;
                    let valB = b[sortColumn] ?? 0;
                    if (typeof valA === 'string') {
                        return sortAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                    return sortAscending ? valA - valB : valB - valA;
                });

                renderTable(currentWeatherData);
                renderSortIndicators();
            }

            function renderSortIndicators() {
                document.querySelectorAll('th.sortable span').forEach(span => { span.textContent = ''; });
                const activeSpan = document.getElementById(`sort-${sortColumn}`);
                if (activeSpan) activeSpan.textContent = sortAscending ? '▲' : '▼';
            }

            function renderTable(data) {
                const tbody = document.getElementById('weather-rows');
                tbody.innerHTML = '';

                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-slate-50/80 transition-colors';
                    row.innerHTML = `
                        <td class="px-4 py-3.5 font-bold text-slate-900">${item.name}</td>
                        <td class="px-4 py-3.5 font-medium text-slate-700">${item.temp}°F</td>
                        <td class="px-4 py-3.5">${getFeelsLikeBadge(item.feelsLike)}</td>
                        <td class="px-4 py-3.5 text-slate-600">
                            <span class="font-semibold text-slate-800">${item.dewPoint}°</span>
                            <span class="text-xs text-slate-400 ml-0.5">(${item.humidity}%)</span>
                        </td>
                        <td class="px-4 py-3.5 text-slate-600">
                            <span>${item.windDir} ${item.windSpeed} mph</span>
                            ${item.windGust && item.windGust > item.windSpeed + 4 
                                ? `<span class="text-xs font-semibold text-amber-600 ml-1">G ${item.windGust}</span>` 
                                : ''}
                        </td>
                        <td class="px-4 py-3.5">${getCapeBadge(item.cape)}</td>
                        <td class="px-4 py-3.5 text-slate-600">${item.rain > 0 ? `<span class="font-bold text-blue-600">${item.rain} in</span>` : '0.00 in'}</td>
                        <td class="px-4 py-3.5">
                            <div class="flex items-center gap-1.5">
                                <img src="${item.iconUrl}" alt="${item.condition}" class="w-7 h-7 -my-1" />
                                <span class="font-medium text-slate-700">${item.condition}</span>
                                <span class="text-xs text-slate-400">(${item.cloudPct}%)</span>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                hide('loading');
                show('table-container');
            }

            document.querySelectorAll('th.sortable').forEach(header => {
                header.addEventListener('click', () => sortData(header.getAttribute('data-column')));
            });

            document.getElementById('btn-refresh').addEventListener('click', fetchAllWeather);

            // 10-minute automated polling
            setInterval(fetchAllWeather, 10 * 60 * 1000);

            fetchAllWeather();
        })();
    </script>
</body>
</html>
