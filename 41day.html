            { day: "Day 40", date: "Dec 15", name: "Cape Horn", type: "Scenic Navigation", risk: "LEVEL 1", rClass: "level-1", sun: "--", temp: "42°F", icon: "🚢", lat: -55.98, lon: -67.29, zoom: 11, 
              advice: "<div class='advice-block'><b>Logistics:</b> Scenic navigation past Cape Horn on the return journey[cite: 1]. Conclude with the Farewell Dinner onboard[cite: 1].</div>" },

            { day: "Day 41", date: "Dec 16", name: "Ushuaia → Austin", type: "Travel Home", risk: "LEVEL 1", rClass: "level-1", sun: "--", temp: "48°F", icon: "✈️", lat: 30.26, lon: -97.74, zoom: 4, 
              advice: "<div class='advice-block'><b>Logistics:</b> Disembark Ushuaia at 5 PM[cite: 1]. Private Viking charter flight to Buenos Aires (USH→EZE, 12:38 - 4:08 PM)[cite: 1]. United Business Class overnight to Houston (IAH), clear Global Entry Customs, and hop to Austin (AUS) arriving Dec 17[cite: 1]. Total journey: ~31.5 hours[cite: 1].</div>" }
        ];

        const list = document.getElementById('location-list');
        itinerary.forEach((s) => {
            const li = document.createElement('li');
            li.className = 'location-item';
            li.innerHTML = `<div class='icon-box'>${s.icon}</div><div class='info-box'><span class='day-num'>${s.day} | ${s.date}</span><span class='site-name'>${s.name}</span></div>`;
            li.onclick = () => {
                map.flyTo([s.lat, s.lon], s.zoom, { duration: 3 });
                document.getElementById('risk-val').textContent = s.risk;
                document.getElementById('risk-val').className = "risk-tag " + s.rClass;
                document.getElementById('sun-val').textContent = s.sun;
                document.getElementById('temp-val').textContent = s.temp;
                document.getElementById('photo-advice').innerHTML = s.advice;
                document.getElementById('ice-warning').style.display = (s.type.includes("Glacier") || s.name.includes("Antarctica") || s.name.includes("Glaciers")) ? "block" : "none";
            };
            list.appendChild(li);
            L.marker([s.lat, s.lon]).addTo(map).bindPopup(`<b>${s.day} - ${s.name}</b>`);
        });
    </script>
</body>
