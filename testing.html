<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TX Weather Command | Strategic GIS Hub</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { 
     --primary: #ffcc00; 
     --bg: #020617; 
     --panel: #0f172a; 
     --border: #1e293b; 
     --text: #f8fafc;
    --danger: #ef4444; 
  }
  * { box-sizing: border-box; } 
  html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: center; } 
  #command-container { 
    display: flex; 
    width: 100vw; 
    height: 100vh; 
    border: none;
    position: relative;
  } 
  #sidebar, #right-panel { 
    width: 280px; 
    height: 100%; 
    background: var(--panel); 
    display: flex; 
    flex-direction: column; 
    border-color: var(--border); 
    border-style: solid;
    z-index: 2000; 
  } 
  #sidebar { border-right-width: 3px; } 
  #right-panel { border-left-width: 3px; } 
  #map { flex: 1; height: 100%; background: #000; z-index: 1; }
  
  .dark-osm { filter: brightness(0.7) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }

  header { 
    background: #000; 
    padding: 0 25px; 
    border-bottom: 3px solid var(--primary); 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    position: absolute; 
    top: 0; left: 280px; right: 280px; 
    z-index: 3000; 
    height: 65px; 
  } 
  header h1 { margin: 0; font-size: 22px; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; } 
  .section-title { 
    font-size: 12px; 
    text-transform: uppercase; 
    color: var(--primary); 
    padding: 15px 20px 8px; 
    font-weight: 900; 
    letter-spacing: 1px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid var(--border); 
  } 
  .control-group { padding: 10px 20px; } 
  label { display: flex; align-items: center; margin: 12px 0; cursor: pointer; font-size: 13px; font-weight: 700; color: #cbd5e1; } 
  input[type="checkbox"] { width: 18px; height: 18px; margin-right: 12px; accent-color: var(--primary); } 
  .btn-focus { 
    background: var(--primary); color: #000; border: none; 
    padding: 10px 20px; border-radius: 4px; 
    font-weight: 900; cursor: pointer; font-size: 12px; text-transform: uppercase; 
  }
  #alert-list { padding: 15px; flex-grow: 1; overflow-y: auto; background: #020617; } 
  .alert-card { 
    background: #1e293b; padding: 15px; margin-bottom: 12px; border-radius: 6px; border-left: 5px solid var(--primary);
  } 
  .alert-card.Extreme, .alert-card.Severe { border-left-color: var(--danger); background: #450a0a; } 
  .alert-card span { display: block; font-size: 14px; font-weight: 900; margin-bottom: 4px; color: #fff; line-height: 1.2; } 
  .alert-card small { font-size: 11px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; } 
  #as-of { font-weight: 800; font-family: monospace; color: var(--primary); font-size: 14px; }
</style>
</head>
<body>
<div id="command-container"> 
    <header> 
      <h1>Texas Weather Command</h1> 
      <button class="btn-focus" onclick="focusVizcaya()">Focus: Vizcaya</button> 
      <div id="as-of">INITIALIZING...</div> 
    </header>
    <div id="sidebar"> 
      <div style="height:65px;"></div> 
      <div class="section-title">Atmospheric Overlays</div> 
      <div class="control-group"> 
        <label><input type="checkbox" id="radar" checked> Live NEXRAD Radar</label> 
        <label><input type="checkbox" id="radarLoop"> Animate Radar Loop</label> 
        <label><input type="checkbox" id="sat"> GOES-16 IR Satellite</label> 
      </div> 
      <div class="section-title">Risk Layers</div> 
      <div class="control-group"> 
        <label><input type="checkbox" id="wwa" checked> Watches & Warnings</label> 
        <label><input type="checkbox" id="spc1"> SPC Day 1 Outlook</label> 
        <label><input type="checkbox" id="spc2"> SPC Day 2 Outlook</label> 
      </div> 
    </div>
    <div id="map"></div>
    <div id="right-panel"> 
      <div style="height:65px;"></div> 
      <div class="section-title">Tactical Alert Feed</div> 
      <div id="alert-list"></div> 
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
<script>
const VIZ_LAT = 30.5871, VIZ_LON = -97.6410;

// 1. Initialize Map
const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([31.2, -99.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  className: 'dark-osm'
}).addTo(map);

// 2. Vizcaya Dot
const vizcayaDot = L.circleMarker([VIZ_LAT, VIZ_LON], { 
    radius: 9, fillColor: "#ffcc00", color: "#fff", weight: 3, opacity: 1, fillOpacity: 1, pane: 'overlayPane'
}).addTo(map).bindPopup("<b>VIZCAYA CENTER</b>");

function focusVizcaya() { 
    map.flyTo([VIZ_LAT, VIZ_LON], 10); 
    vizcayaDot.openPopup();
}

// 3. Radar Loop Frames Preloaded for Smooth Opacity Cycling
const radarLoopLayers = [
  L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913-m20m/{z}/{x}/{y}.png', { opacity: 0, transparent: true, maxZoom: 19, zIndex: 100 }),
  L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913-m15m/{z}/{x}/{y}.png', { opacity: 0, transparent: true, maxZoom: 19, zIndex: 100 }),
  L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913-m10m/{z}/{x}/{y}.png', { opacity: 0, transparent: true, maxZoom: 19, zIndex: 100 }),
  L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913-m05m/{z}/{x}/{y}.png', { opacity: 0, transparent: true, maxZoom: 19, zIndex: 100 }),
  L.tileLayer('https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png', { opacity: 0, transparent: true, maxZoom: 19, zIndex: 100 })
];

let radarAnimIndex = 0;
let radarAnimInterval = null;

// 4. Weather Layers
const layers = { 
  radar: L.tileLayer.wms('https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi', { 
    layers: 'nexrad-n0r-900913', format: 'image/png', transparent: true, opacity: 0.8, zIndex: 100 
  }).addTo(map),
  
  sat: L.tileLayer.wms('https://mesonet.agron.iastate.edu/cgi-bin/wms/goes/conus_ir.cgi', { 
    layers: 'conus_ir_4km', format: 'image/png', transparent: true, opacity: 0.5, zIndex: 90 
  }),

  wwa: L.layerGroup(),

  spc1: L.esri.dynamicMapLayer({ 
    url: 'https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/SPC_wx_outlks/MapServer', 
    layers: [1], 
    opacity: 0.6,
    zIndex: 110
  }),

  spc2: L.esri.dynamicMapLayer({ 
    url: 'https://mapservices.weather.noaa.gov/vector/rest/services/outlooks/SPC_wx_outlks/MapServer', 
    layers: [9], 
    opacity: 0.6,
    zIndex: 105
  })
};

// Smooth Radar Loop Control Logic via Opacity Blending
document.getElementById('radarLoop').onchange = (e) => {
  const looping = e.target.checked;
  if (looping) {
    if (map.hasLayer(layers.radar)) {
      map.removeLayer(layers.radar);
      document.getElementById('radar').checked = false;
    }
    // Preload all layers to map with 0 opacity so tiles are already cached & rendered
    radarLoopLayers.forEach(l => {
      l.setOpacity(0);
      if (!map.hasLayer(l)) l.addTo(map);
    });

    radarAnimIndex = 0;
    radarLoopLayers[radarAnimIndex].setOpacity(0.8);

    radarAnimInterval = setInterval(() => {
      radarLoopLayers[radarAnimIndex].setOpacity(0);
      radarAnimIndex = (radarAnimIndex + 1) % radarLoopLayers.length;
      radarLoopLayers[radarAnimIndex].setOpacity(0.8);
    }, 450);
  } else {
    clearInterval(radarAnimInterval);
    radarLoopLayers.forEach(l => {
      l.setOpacity(0);
      if (map.hasLayer(l)) map.removeLayer(l);
    });
  }
};

async function loadWarningPolygons() {
  try {
    const res = await fetch('https://api.weather.gov/alerts/active?area=TX', {
      headers: { 'User-Agent': 'VizcayaTactical/1.0' }
    });
    const data = await res.json();
    if (data.features) {
      const geoLayer = L.geoJSON(data, {
        style: f => {
          const e = (f.properties.event || '').toLowerCase();
          if (e.includes('tornado')) return { color: '#ff0000', weight: 4, fillOpacity: 0.3 };
          if (e.includes('severe thunderstorm')) return { color: '#ff6600', weight: 3, fillOpacity: 0.2 };
          if (e.includes('heat') || e.includes('excessive heat')) return { color: '#ff7f00', weight: 2, fillOpacity: 0.25 };
          if (e.includes('special weather statement')) return { color: '#eab308', weight: 2, fillOpacity: 0.15 };
          return { color: '#38bdf8', weight: 2, fillOpacity: 0.15 }; 
        },
        onEachFeature: (f, layer) => {
          if (f.properties && f.properties.event) {
            layer.bindPopup(`<b>${f.properties.event}</b><br><small>${f.properties.areaDesc || ''}</small>`);
          }
        }
      });
      layers.wwa.clearLayers();
      layers.wwa.addLayer(geoLayer);
      if (document.getElementById('wwa').checked) {
        layers.wwa.addTo(map);
      }
    }
  } catch (err) {
    console.warn("Could not load warning polygons", err);
  }
}

loadWarningPolygons();
setInterval(loadWarningPolygons, 300000);

document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => { 
  if (checkbox.id === 'radarLoop') return;
  checkbox.onchange = () => { 
    const layer = layers[checkbox.id];
    if (!layer) return;
    if (checkbox.checked && checkbox.id === 'radar' && document.getElementById('radarLoop').checked) {
      document.getElementById('radarLoop').checked = false;
      clearInterval(radarAnimInterval);
      radarLoopLayers.forEach(l => {
        l.setOpacity(0);
        if (map.hasLayer(l)) map.removeLayer(l);
      });
    }
    checkbox.checked ? map.addLayer(layer) : map.removeLayer(layer); 
  };
});

async function updateAlerts() { 
  const list = document.getElementById('alert-list'); 
  try { 
    const response = await fetch('https://api.weather.gov/alerts/active?area=TX', { 
        headers: { 'User-Agent': 'VizcayaTactical/1.0' } 
    }); 
    const data = await response.json(); 
    document.getElementById('as-of').innerText = new Date().toLocaleTimeString();

    if (!data.features?.length) { 
      list.innerHTML = '<div style="color:#64748b; padding:20px; text-align:center;">NO ACTIVE ALERTS</div>'; 
      return; 
    }

    list.innerHTML = data.features.slice(0, 30).map(f => { 
      const p = f.properties; 
      return ` 
        <div class="alert-card ${p.severity}"> 
          <span>${p.event}</span> 
          <small>${(p.areaDesc || '').split(';')[0]}</small> 
        </div> 
      `; 
    }).join(''); 
  } catch (e) { 
    list.innerHTML = '<div style="color:red; padding:20px;">SYNC ERROR</div>'; 
  } 
}

updateAlerts();
setInterval(updateAlerts, 120000);
</script>
</body>
</html>
